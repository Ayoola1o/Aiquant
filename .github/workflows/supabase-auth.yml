name: Aiquant CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aiquant-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: >-
          python -m pip install --upgrade pip
          "PyJWT[crypto]>=2.10,<3" requests numpy pandas scipy scikit-learn
          yfinance websockets pydantic alpaca-py
      - name: Compile all backend Python files
        run: python -m compileall -q backend
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest test_supabase_auth test_suite -v

  frontend:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: TypeScript project checks
        run: npx --prefix frontend tsc -b frontend/tsconfig.json --pretty false
      - name: Build frontend for production
        run: npm run build --prefix frontend
