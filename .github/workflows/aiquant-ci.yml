name: Aiquant CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiquant-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: >-
          python -m pip install --upgrade pip
          "PyJWT[crypto]>=2.10,<3" requests numpy pandas scipy scikit-learn
          yfinance websockets pydantic alpaca-py
      - name: Compile all backend Python files
        run: python -m compileall -q backend
      - name: Run discovered backend unit tests
        working-directory: backend
        run: python -m unittest discover -s . -p "test_*.py" -v

  frontend:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate out-of-sync lockfile on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/full-app-pages-icons'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Commit regenerated lockfile and queue verification run
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/full-app-pages-icons'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "LOCKFILE_UPDATED=false" >> "$GITHUB_ENV"
          else
            git commit -m "fix: synchronize frontend npm lockfile"
            git push
            echo "LOCKFILE_UPDATED=true" >> "$GITHUB_ENV"
          fi
      - name: Queue CI for the regenerated commit
        if: env.LOCKFILE_UPDATED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/aiquant-ci.yml/dispatches" -f ref="${GITHUB_REF_NAME}"
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: TypeScript project checks
        run: npx --prefix frontend tsc -b frontend/tsconfig.json --pretty false
      - name: Build frontend for production
        run: npm run build --prefix frontend
